<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Photo Stream</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background: #334155;
            border: 1px solid #475569;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background: #3b82f6;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #2563eb;
        }

        .feed-grid {
            display: grid;
            gap: 15px;
        }

        .photo-card {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .photo-card img {
            width: 100%;
            border-radius: 4px;
            margin-top: 10px;
        }

        .meta {
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Share a Photo</h2>
        <input type="text" id="senderName" placeholder="Your Name / ID">
        <input type="file" id="imageInput" accept="image/*">
        <button onclick="uploadPhoto()">Broadcast to Network</button>
    </div>

    <div class="card">
        <h2>Live Shared Feed</h2>
        <div class="feed-grid" id="feedContainer">
            <p class="meta">Loading feed...</p>
        </div>
    </div>

    <script>
        // Convert selected image file to Base64
        function uploadPhoto() {
            const fileInput = document.getElementById('imageInput');
            const senderName = document.getElementById('senderName').value || 'Anonymous';

            if (fileInput.files.length === 0) {
                alert('Please select an image first.');
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(event) {
                const base64Image = event.target.result;

                try {
                    const response = await fetch('/api/upload', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: base64Image, sender: senderName })
                    });

                    const result = await response.json();
                    if (result.success) {
                        fileInput.value = '';
                        fetchFeed(); // immediately refresh feed
                    } else {
                        alert('Error: ' + result.error);
                    }
                } catch (err) {
                    alert('Upload failed: ' + err.message);
                }
            };

            reader.readAsDataURL(file);
        }

        // Fetch feed from Vercel backend
        async function fetchFeed() {
            try {
                const response = await fetch('/api/feed');
                const data = await response.json();
                const container = document.getElementById('feedContainer');

                if (!data.photos || data.photos.length === 0) {
                    container.innerHTML = '<p class="meta">No photos shared yet.</p>';
                    return;
                }

                container.innerHTML = data.photos.map(p => `
                    <div class="photo-card">
                        <div class="meta">Shared by: <strong>${escapeHtml(p.sender)}</strong></div>
                        <img src="${p.image}" alt="Shared photo">
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load feed', err);
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Auto-poll the feed every 3 seconds to get updates from other users
        setInterval(fetchFeed, 3000);
        fetchFeed(); // Initial load
    </script>
</body>
</html>
